ja = "物理的に体がさっぱりするのはもちろんですが、\n気持ちの面でも少しリセットされる感じがあります。"
zh = "身体会变清爽不用说\n心情也会有点被重置"

[[segments]]
id = "2-seg_131.3a"
start = 1036.84
end = 1039.96
speaker = "C"
ja = "誰にも聞かれていないことを\n祈りながら、"
zh = "我也会一边祈祷没人听见，"

[[segments]]
id = "2-seg_131.3b"
start = 1040.04
end = 1043.849
speaker = "C"
ja = "お風呂で思いっきり歌を歌ってしまうこともあります。\nいいよね。"
zh = "一边在浴室里尽情唱歌。很不错呢。"

[[segments]]
id = "2-seg_132.1"
start = 1043.929
end = 1049.56
speaker = "C"
ja = "お風呂場の中だとなぜか少し歌が上手くなった気がしますし、"
zh = "在浴室里，不知为什么会觉得自己唱歌变好了一点，"

[[segments]]
id = "2-seg_132.2a"
start = 1049.64
end = 1052.56
speaker = "C"
ja = "大きい声を出すことで\nストレス発散にもなっています。"
zh = "大声唱出来也能发泄压力。"

[[segments]]
id = "2-seg_132.2b"
start = 1052.64
end = 1054.96
speaker = "C"
ja = "すっきりしたい時は、\n入浴剤を使います。"
zh = "想清爽一下的时候，我会用入浴剂。"

[[segments]]
id = "2-seg_132.3"
start = 1055.04
end = 1060.934
speaker = "C"
ja = "お風呂が私にとっての一番手軽な\n自分の機嫌の取り方かもしれませんね。"
zh = "对我来说，洗澡也许是最简单的哄自己开心的方法。"

[[segments]]
id = "2-seg_133"
start = 1061.014
end = 1062.144
speaker = "D"
ja = "めっちゃいいなぁ。"
zh = "超好啊。"

[[segments]]
id = "2-seg_134"
start = 1062.224
end = 1063.324
speaker = "D"
ja = "うわぁいいなぁ"
zh = "哇，好棒啊。"

[[segments]]
id = "2-seg_135"
start = 1063.924
end = 1065.794
speaker = "D"
ja = "うわぁお風呂っていい"
zh = "哇，洗澡真好。"

[[segments]]
id = "2-seg_136"
start = 1065.874
end = 1066.884
speaker = "C,D"
ja = "分かるよね。"
zh = "懂吧。"

[[segments]]
id = "2-seg_139"
start = 1066.964
end = 1068.974
speaker = "D"
ja = "めっちゃ好きだわお風呂"
zh = "我超喜欢洗澡。"

[[segments]]
id = "2-seg_140"
start = 1070.036
end = 1072.246
speaker = "C"
ja = "お風呂で歌うと本当に上手く感じるよね"
zh = "在浴室唱歌真的会觉得自己唱得更好呢。"

[[segments]]
id = "2-seg_141"
start = 1072.326
end = 1074.346
speaker = "D"
ja = "エコーがねかかるよね"
zh = "因为会有回声呢。"

[[segments]]
id = "2-seg_142"
start = 1074.426
end = 1076.046
speaker = "C,D"
ja = "なんでだろうね。なんだろう。"
zh = "为什么呢。是什么呢。"

[[segments]]
id = "2-seg_144"
start = 1076.126
end = 1081.996
speaker = "C,D"
ja = "エコーってなんで上手く聞こえるんだろう。\nカラオケでも、マイクエコー上げると上手く聞こえる。"
zh = "为什么有回声就像唱得好？\n卡拉OK调高回声也会更会唱"

[[segments]]
id = "2-seg_146.1"
start = 1082.076
end = 1086.46
speaker = "C"
ja = "めちゃくちゃわかる。\nエコーずっとついてればいいのにって思う、自分の声に。"
zh = "超懂。会想要是自己的声音一直带回声就好了。"

[[segments]]
id = "2-seg_146.2"
start = 1086.54
end = 1091.36
speaker = "C"
ja = "なんかもし普通の喋ってる声にエコーがついてたらさ、\n超なんか説得力増さない？"
zh = "平常说话也带回声\n是不是感觉超有说服力？"

[[segments]]
id = "2-seg_146.3"
start = 1091.44
end = 1096.086
speaker = "C"
ja = "なんかウグイス嬢さんみたいな感じ。"
zh = "就像播报员那种感觉。"

[[segments]]
id = "2-seg_147"
start = 1096.4859999999999
end = 1097.7359999999999
speaker = "D"
ja = "でもさちょっとやだ"
zh = "可是那有点讨厌吧。"

[[segments]]
id = "2-seg_148"
start = 1098
end = 1100.454
speaker = "D"
ja = "エコーついてるんだよって、ちょっとやだよね。"
zh = "说「我自带回声哦」，有点讨厌吧。"

[[segments]]
id = "2-seg_149"
start = 1100.534
end = 1102.444
speaker = "C,D"
ja = "私だけ? うちらだけ? 私らだけ?"
zh = "只有我吗？只有我们吗？只有咱们吗？"

[[segments]]
id = "2-seg_152"
start = 1102.594
end = 1105.704
speaker = "D"
ja = "それならいいや確かにエコー好きだわ私"
zh = "那样的话就行吧。确实我喜欢回声。"

[[segments]]
id = "2-seg_153"
start = 1105.784
end = 1106.944
speaker = "C"
ja = "ねえ、あ、"
zh = "嗯，啊。"

[[segments]]
id = "2-seg_154"
start = 1107.0439999999999
end = 1108.394
speaker = "C"
ja = "二人の機嫌の取り方は？"
zh = "你们两个哄自己开心的方法呢？"

[[segments]]
id = "2-seg_155"
start = 1108.4940000000001
end = 1112.944
speaker = "D,C"
ja = "え? なんかある? な? 機嫌の取り方?\nでもそれこそ爆食?"
zh = "欸 有什么吗？哄心情？\n说到底就是暴食？"

[[segments]]
id = "2-seg_158"
start = 1113.2440000000001
end = 1115.944
speaker = "D"
ja = "コンビニでめちゃくちゃ買って食べるか"
zh = "要么就在便利店买一大堆来吃。"

[[segments]]
id = "2-seg_159"
start = 1118.644
end = 1119.144
speaker = "D"
ja = "え?"
zh = "欸？"

[[segments]]
id = "2-seg_160"
start = 1119.2939999999999
end = 1123.704
speaker = "D,C"
ja = "機嫌の取り方? うん。\nいやでも私爆食だな"
