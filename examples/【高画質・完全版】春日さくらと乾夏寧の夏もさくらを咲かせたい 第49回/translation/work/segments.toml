speaker = "A"
ja = "春日さくらと乾夏寧の夏もさくらを咲かせたい"
zh = "春日樱与乾夏宁的「也想让夏天绽放樱花」"

[[segments]]
id = "1-seg_3"
start = 18.404
end = 20.754
speaker = "A"
ja = "皆さん、咲いてますか？"
zh = "大家开花了吗"

[[segments]]
id = "1-seg_4"
start = 23.804000000000002
end = 24.974
speaker = "A"
ja = "こんばんは、春日さくらです。"
zh = "晚上好 我是春日樱"

[[segments]]
id = "1-seg_5"
start = 25.054
end = 27.96
speaker = "B"
ja = "こんばんは、乾夏寧です。"
zh = "晚上好 我是乾夏宁"

[[segments]]
id = "1-seg_6"
start = 28.04
end = 36.876
speaker = "A"
ja = "この番組は季節を名前に持つ私たち二人が、\n夏のような爽やかな風と春のような柔らかい空気を少しでもお届けできたらいいなという番組です。"
zh = "这个节目由名字带季节的我们\n送来夏风与春天般的柔和空气"

[[segments]]
id = "1-seg_7"
start = 37.676
end = 41.236
speaker = "C"
ja = "ということで早速ですが皆さん何かお気づきですか?"
zh = "那么马上开始，大家有没有发现什么？"

[[segments]]
id = "1-seg_8"
start = 41.316
end = 42.226
speaker = "A"
ja = "お気づきですか?"
zh = "发现了吗？"

[[segments]]
id = "1-seg_9"
start = 42.576
end = 43.826
speaker = "A"
ja = "まぁ分かるよね?"
zh = "应该看得出来吧？"

[[segments]]
id = "1-seg_10"
start = 44.126000000000005
end = 45.275999999999996
speaker = "A"
ja = "分かりやすいよね?"
zh = "很明显吧？"

[[segments]]
id = "1-seg_11"
start = 47.572
end = 51.082
speaker = "A,C"
ja = "どこが変わった？そう！なんだ？\n実はなんか髪が"
