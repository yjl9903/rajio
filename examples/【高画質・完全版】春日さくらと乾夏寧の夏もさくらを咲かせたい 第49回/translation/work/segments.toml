[[segments]]
id = "1-seg_17"
start = 51.162
end = 53.832
speaker = "A,C"
ja = "なんかなんか、なんかさらさらじゃない？"
zh = "总觉得，是不是变得很顺？"

[[segments]]
id = "1-seg_19"
start = 53.912
end = 54.972
speaker = "A"
ja = "なんかさらさらかも"
zh = "好像真的挺顺的"

[[segments]]
id = "1-seg_21"
start = 55.122
end = 56.382
speaker = "A"
ja = "どうしてどうして?"
zh = "为什么为什么？"

[[segments]]
id = "1-seg_22"
start = 56.462
end = 57.482
speaker = "C"
ja = "なんかいつもと違くない?"
zh = "是不是和平时不一样？"

[[segments]]
id = "1-seg_23"
start = 57.562
end = 59.822
speaker = "A"
ja = "なんかいつもと違うもう言っちゃったけどね"
zh = "是和平时不一样，虽然已经说出来了"

[[segments]]
id = "1-seg_24"
start = 61.22200000000001
end = 62.422000000000004
speaker = "A"
ja = "さらさらだよね?"
zh = "很顺吧？"

[[segments]]
id = "1-seg_25"
start = 62.622
end = 65.47200000000001
speaker = "C"
ja = "そうなの!髪質改善をしました"
zh = "没错！我做了发质改善"

[[segments]]
id = "1-seg_26"
start = 68.172
end = 72.47200000000001
speaker = "C"
ja = "お店の美容院でなんかやってもらったらさらさらになったの"
zh = "在美容院让人弄了一下，就变得很顺了"

[[segments]]
id = "1-seg_27"
start = 72.772
end = 76.672
speaker = "A"
ja = "なんか写真でも伝わってきたけど生だとより?"
zh = "照片里就看得出来了，现场看更明显？"

[[segments]]
id = "1-seg_28"
start = 77.492
end = 81.552
speaker = "C,D"
ja = "さらさら嬉しい！すごい！\nマジで朝起きてもこれだからめっちゃ嬉しいんだ！"
zh = "好顺 好开心 好厉害\n早上起来也这样 超开心"

[[segments]]
id = "1-seg_31"
start = 81.632
end = 83.89200000000001
speaker = "C,D"
ja = "これがいいとこだよね？うん！わかる！"
zh = "这就是它的好处吧？嗯！懂！"

[[segments]]
id = "1-seg_34"
start = 84.14200000000001
end = 91.452
speaker = "C,D"
ja = "いいなぁ！梅雨の時期だからこれから！そう！\n雨降っちゃ嫌と思って！湿気てほしくなかったけど！うねらないといいな！"
zh = "真好啊 接下来就是梅雨季\n怕下雨和湿气 希望别卷起来"

[[segments]]
id = "1-seg_39"
start = 91.532
end = 98.34200000000001
speaker = "C,D"
ja = "大丈夫だよ！私最近もううねりがすごいよ！見せらんない、多分！\n梅雨、めっちゃ全部こうなっちゃうの！やったことある？"
zh = "没问题 我最近卷得很厉害\n梅雨一来全都会这样 你做过吗"

[[segments]]
id = "1-seg_42"
start = 98.542
end = 101.402
speaker = "D"
ja = "あるよ！1年に1回ぐらい！梅雨前に当てるから！"
zh = "做过！一年大概一次！梅雨前会去弄一下！"

[[segments]]
id = "1-seg_43"
start = 101.482
end = 102.492
speaker = "C"
ja = "それ大丈夫なんだ!"
zh = "那就没问题了！"

[[segments]]
id = "1-seg_44.1"
start = 104.212
end = 108.16
speaker = "D"
ja = "癖になってるよ。え、もう今日じゃない？"
zh = "头发已经有点卷了吧。欸，不就是今天吗？"

[[segments]]
id = "1-seg_44.2"
start = 108.24
end = 112.76
speaker = "D"
ja = "いや、まだまだ。これから当てる、これから当てる。"
zh = "不是，还早还早。之后再去弄，之后再弄。"

[[segments]]
id = "1-seg_44.3"
start = 112.84
end = 116.46
speaker = "D"
ja = "はい、ということで。あとね、納豆。"
zh = "好，那么。还有啊，纳豆。"

[[segments]]
id = "1-seg_44.4"
start = 116.54
end = 121.76
speaker = "D"
ja = "納豆食べてんのみんな。混ぜれば混ぜるほどさ、"
zh = "大家有吃纳豆吗？不是常说越搅拌，"

[[segments]]
id = "1-seg_44.5"
start = 121.84
end = 126.56
speaker = "D"
ja = "納豆の栄養がなんちゃらって言ったりするじゃん。"
zh = "纳豆的营养就会怎样怎样吗。"

[[segments]]
id = "1-seg_44.6"
start = 126.64
end = 130.362
speaker = "D"
ja = "変化ないらしいよ、別に。え、なんなんですか。"
zh = "听说其实没什么变化哦。欸，那算什么啊。"

[[segments]]
id = "1-seg_45"
start = 131.22
end = 132.58
speaker = "C,D"
ja = "ちょ、まず粘り気がね、なくなっちゃう。"
zh = "等等，首先黏稠感会没了吧。"

[[segments]]
id = "1-seg_47"
start = 132.66
end = 136.23
speaker = "D"
ja = "え、でもそれが好きでおいしいから、\nあと食べてる人もいるんだもんね。"
zh = "欸，可是有人就是喜欢那个，觉得好吃才那么吃的吧。"

[[segments]]
id = "1-seg_48"
start = 136.31
end = 136.83
speaker = "C"
ja = "そういうこと?"
zh = "这样？"

[[segments]]
id = "1-seg_49"
start = 136.91
end = 143.44
speaker = "D"
ja = "あ、そういえば私、あの話をして\n家に帰って納豆があったから、めっちゃやってみたんです。"
zh = "说起来 聊完那个回家后\n正好有纳豆 我就狠狠搅了"

[[segments]]
id = "1-seg_50"
start = 143.52
end = 145.57
speaker = "C,D"
ja = "え、嘘嘘。40回くらい混ぜてみた。"
zh = "欸，真的假的。试着搅了大概40下。"

[[segments]]
id = "1-seg_52"
start = 145.65
end = 146.15
speaker = "C"
ja = "どう?"
zh = "怎么样？"

[[segments]]
id = "1-seg_53"
start = 148.22
end = 149.73
speaker = "C"
ja = "まあまあまあ"
zh = "还行吧"

[[segments]]
id = "1-seg_54"
start = 149.81
end = 151.98
speaker = "D"
ja = "でも健康になった気がした"
zh = "不过感觉自己变健康了"

[[segments]]
id = "1-seg_55"
start = 152.06
end = 153.48
speaker = "C"
ja = "本当?食べれたんだ?"
zh = "真的吗？吃得下去啊？"

[[segments]]
id = "1-seg_56"
start = 153.56
end = 154.13
speaker = "D"
ja = "食べれた"
zh = "吃得下去"

[[segments]]
id = "1-seg_57"
start = 154.21
end = 159.424
speaker = "C,D"
ja = "偉いね。なんか納豆の、\nあのあれも最後にしてみた？調味料を。"
zh = "真厉害。纳豆那个，你最后也试了吗？调味料。"

[[segments]]
id = "1-seg_60"
start = 160.024
end = 162.374
speaker = "C,D"
ja = "え？で、またちょっと混ぜてみたいな？そう。"
zh = "欸？然后再稍微搅一搅那样？对。"

[[segments]]
id = "1-seg_62"
start = 162.774
end = 163.524
speaker = "D"
ja = "どうだった?"
zh = "怎么样？"

[[segments]]
id = "1-seg_63"
start = 163.624
end = 165.224
speaker = "C"
ja = "最初に入れた方が良かった"
zh = "还是一开始放比较好"

[[segments]]
id = "1-seg_65"
start = 166.374
end = 172.834
speaker = "C,D"
ja = "やっぱ美味しいけどでも健康にはいいんだもんね。そうなの？\nいや、本当に分かんない。でもなんか難しいですね。"
zh = "果然更好吃 但对健康好吧\n是吗 我也不清楚 挺难的"

[[segments]]
id = "1-seg_70"
start = 172.914
end = 178.834
speaker = "C,D"
ja = "ね、健康にいいのか？プラシーボ。でも健康にいいんじゃない？\nプラスプラス？正解。そっか。いい気がする。"
zh = "到底健不健康呢 安慰剂？\n应该健康吧 正向正向"

[[segments]]
id = "1-seg_77.1"
start = 178.914
end = 183.36
speaker = "D"
ja = "でも私は混ぜないですよ、ちょっと。\nあの納豆に砂糖を入れて、"
zh = "不过我是不太会搅啦。往纳豆里加砂糖，"

[[segments]]
id = "1-seg_77.2"
start = 183.44
end = 187.76
speaker = "D"
ja = "ということで、夏について！夏について！"
zh = "那么，关于夏天！关于夏天！"

[[segments]]
id = "1-seg_77.3"
start = 187.84
end = 192.938
speaker = "D"
ja = "納豆こねも、ほっぺまーさんからいただきました。\nありがとうございます。春日さん、乾さん、咲いてますか？"
zh = "这封来自ほっぺまー 谢谢\n春日樱 乾夏宁 开花了吗"

[[segments]]
id = "1-seg_85.1"
start = 194.088
end = 200.36
speaker = "D"
ja = "第48回の配信で、納豆を何回かき混ぜればいいか\n議論の波紋を広げていましたね。"
zh = "第48回里 两位讨论纳豆\n该搅几次 引发了不少波澜"

[[segments]]
id = "1-seg_85.2"
start = 200.44
end = 210.038
speaker = "D"
ja = "自分も10回くらいです。混ぜる前にからしを入れて、\n混ぜた後から納豆のタレまたは醤油を入れますね。ただ、"
zh = "我也是大概10下\n先放芥末 搅完再放酱汁或酱油"

[[segments]]
id = "1-seg_88"
start = 210.74
end = 217.65
speaker = "D"
ja = "あの有名な魯山人は、最低でも400回かき混ぜると\n美味しくなると言ったとされています。試しにやったら、"
zh = "据说鲁山人曾说\n至少搅400下会变好吃 我试了"

[[segments]]
id = "1-seg_89"
start = 217.73
end = 220.55
speaker = "A"
ja = "確かに美味しいのですよ。400回やったの？"
zh = "确实很好吃哦。你真的搅了400下？"

[[segments]]
id = "1-seg_90"
start = 220.63
end = 222.49
speaker = "D"
ja = "美味しいの?"
zh = "好吃吗？"

[[segments]]
id = "1-seg_91"
start = 222.64000000000001
end = 225.1
speaker = "D"
ja = "え?なんで混ぜれば混ぜるほど美味しいの?"
zh = "欸？为什么越搅越好吃啊？"

[[segments]]
id = "1-seg_92"
start = 225.18
end = 231.65
speaker = "A"
ja = "でもなんかさ、分かんないけど、お菓子作りとかでも\n泡立てたらバーって膨らんで減ったりするじゃん、泡。"
zh = "像做点心打发之后\n泡泡会一下膨起来又消下去吧"

[[segments]]
id = "1-seg_93"
start = 231.73
end = 232.75
speaker = "D"
ja = "確かに確かに"
zh = "确实确实"

[[segments]]
id = "1-seg_94"
start = 232.83
end = 233.84
speaker = "A"
ja = "あのなんか"
zh = "就是那个"

[[segments]]
id = "1-seg_95"
start = 234.772
end = 243.932
speaker = "C,D"
ja = "うわーってもこもこもこってなって落ち着いたりするから、確かに。\n400回混ぜたら逆にもこもこじゃなくなる可能性ある。逆に、逆に今度、"
zh = "会起很多泡又稳定下来\n搅400下反而可能不那么蓬"

[[segments]]
id = "1-seg_100"
start = 244.012
end = 251.282
speaker = "C,D"
ja = "え、ちょっとやってみよっかな？やるか。やるか？\nえ、やる？ここで。持ってくる？持ってくる？実証する？"
zh = "要不要试试？来吗？\n在这里？拿过来实证一下？"

[[segments]]
id = "1-seg_105"
start = 251.362
end = 253.082
speaker = "C"
ja = "スタジオ納豆の匂いにして帰ろ?"
zh = "让录音棚变成纳豆味再回去吧？"

[[segments]]
id = "1-seg_106"
start = 253.162
end = 258.17199999999997
speaker = "C,D"
ja = "100回、200回、300回、400回でさ、\n4つぐらい検証したいっすね？いいんじゃん、やろう。いいよね？"
zh = "100 200 300 400下\n做四种来验证吧 可以啊"

[[segments]]
id = "1-seg_112"
start = 258.522
end = 267.418
speaker = "C,D"
ja = "もしハマったらマジで廃人になるかもしんないしね。\n確かにね。そう。やったことないんだけど。毎回400回混ぜたらこの辺きつい。なんかちょっと。"
zh = "迷上了可能真会废掉\n每次搅400下 这附近会很累"

[[segments]]
id = "1-seg_119"
start = 267.498
end = 268.978
speaker = "C"
ja = "面白いね納豆って"
zh = "纳豆还挺有意思的"

[[segments]]
id = "1-seg_120"
start = 269.058
end = 270.428
speaker = "D"
ja = "奥が深いですね。"
zh = "真是深奥呢。"

[[segments]]
id = "1-seg_121"
start = 270.508
end = 273.668
speaker = "C"
ja = "ねなんか他あるなんかそういうやつ"
zh = "还有别的这种讲究吗？"

[[segments]]
id = "1-seg_122"
start = 275.51800000000003
end = 276.01800000000003
speaker = "D"
ja = "え?"
zh = "欸？"

[[segments]]
id = "1-seg_123"
start = 276.51800000000003
end = 280.528
speaker = "D"
ja = "なんかその、ラーメンの海苔いつ食べるみたいな。"
zh = "比如拉面里的海苔什么时候吃之类的。"

[[segments]]
id = "1-seg_124"
start = 280.608
end = 287.468
speaker = "C"
ja = "迷うよね。私も食べ方があって、\nラーメンの海苔をちょっとスープに浸して、"
zh = "会犹豫呢 我也有吃法\n把拉面海苔稍微浸一下汤"

[[segments]]
id = "1-seg_125"
start = 287.988
end = 293.96
speaker = "C,D"
ja = "べちゃべちゃじゃない、ちょっと浸して、\nはい、お米と一緒に食べるのが好きなの。"
zh = "不是泡软 只是稍微浸一下\n我喜欢配米饭一起吃"

[[segments]]
id = "1-seg_127.2"
start = 294.04
end = 296.96
speaker = "D"
ja = "家系とかでお米つけられるとこ、美味しそう。"
zh = "家系拉面那种可以配米饭的店，听起来好好吃。"

[[segments]]
id = "1-seg_127.3"
start = 297.04
end = 301.248
speaker = "D"
ja = "うまい。でも私ラーメン屋さんで、\nラーメンと一緒に白米まだ頼んだことなくて。"
zh = "很好吃。不过我在拉面店还没点过拉面配白饭。"

[[segments]]
id = "1-seg_128"
start = 301.328
end = 302.098
speaker = "C"
ja = "本当に?"
zh = "真的吗？"

[[segments]]
id = "1-seg_129.1"
start = 302.178
end = 305.16
speaker = "D"
ja = "美味しいよ。美味しいね、絶対それは。"
zh = "很好吃哦。那绝对很好吃。"

[[segments]]
id = "1-seg_129.2"
start = 305.24
end = 308.96
speaker = "D"
ja = "私はだいたいパリパリのままで食べたいなっていう気持ちで、"
zh = "我通常会想着今天要趁它还脆脆的时候吃，"

[[segments]]
id = "1-seg_129.3"
start = 309.04
end = 312.938
speaker = "D"
ja = "今日食べようと思うんだけど、気づいたら沈んでて一番下。"
zh = "结果回过神来，它已经沉到最下面了。"

[[segments]]
id = "1-seg_130"
start = 315.22
end = 321.02000000000004
speaker = "D"
ja = "でもさ、なんか具材、特にこれは女子だけの話かもしれないですけど、\nお腹がいっぱいになっちゃう問題。"
zh = "配料这个问题 也许女生才懂\n就是很容易吃饱"

[[segments]]
id = "1-seg_131"
start = 321.12
end = 322.03
speaker = "C"
ja = "マジでそうなの?"
zh = "真的会这样吗？"

[[segments]]
id = "1-seg_132"
start = 322.11
end = 325.68
speaker = "D"
ja = "卵とチャーシューを早めにクリアしないと、後"
zh = "鸡蛋和叉烧不早点解决的话，后面就..."

[[segments]]
id = "1-seg_133"
start = 325.76
end = 326.68
speaker = "C"
ja = "マジでそうなの?"
zh = "真的会这样吗？"

[[segments]]
id = "1-seg_134"
start = 326.76
end = 327.58
speaker = "D"
ja = "がきつい。"
zh = "会很痛苦。"

[[segments]]
id = "1-seg_135"
start = 327.66
end = 329.68
speaker = "C"
ja = "そうチャーシュー入んないの最後に"
zh = "对，叉烧到最后就吃不下了"

[[segments]]
id = "1-seg_136"
start = 329.76
end = 331.33
speaker = "D"
ja = "んない本当卵も入んない"
zh = "吃不下，真的，鸡蛋也吃不下"

[[segments]]
id = "1-seg_137"
start = 331.41
end = 335.62
speaker = "C"
ja = "なんだよね。私何回も言ってさ、\nチャーシュー残しちゃってさ、最後まで。"
